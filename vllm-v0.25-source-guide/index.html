    &lt;h1&gt;一条请求，如何穿过 vLLM&lt;/h1&gt;
    &lt;p class=&quot;lede&quot;&gt;从 &lt;code&gt;POST /v1/chat/completions&lt;/code&gt; 追到调度、GPU forward、Paged KV 写入，再沿输出队列返回 SSE。重点把“预分配显存、Block ID、Block Table、Slot Mapping、Prefix Cache”五个容易混淆的概念拆开。&lt;/p&gt;

  &lt;section class=&quot;section&quot;&gt;
    &lt;div class=&quot;viz-grid takeaways&quot;&gt;
      &lt;article class=&quot;card takeaway&quot;&gt;&lt;span class=&quot;n&quot;&gt;01 · 同步基线的一轮&lt;/span&gt;&lt;p&gt;&lt;code&gt;EngineCore.step()&lt;/code&gt; 的核心顺序是：&lt;strong&gt;schedule → execute_model → update_from_output&lt;/strong&gt;。默认异步调度会改走 batch queue，把这些阶段跨批次重叠。&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;card takeaway&quot;&gt;&lt;span class=&quot;n&quot;&gt;02 · KV 不逐请求 malloc&lt;/span&gt;&lt;p&gt;GPU 启动时先开一整池 KV tensor；请求期间分配的是&lt;strong&gt;页号 / Block ID&lt;/strong&gt;，不是重新申请 CUDA 显存。&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;card takeaway&quot;&gt;&lt;span class=&quot;n&quot;&gt;03 · PagedAttention 的关键&lt;/span&gt;&lt;p&gt;&lt;strong&gt;Block Table&lt;/strong&gt; 负责读哪些物理页；&lt;strong&gt;Slot Mapping&lt;/strong&gt; 负责把本轮 K/V 写进哪个扁平槽位。&lt;/p&gt;&lt;/article&gt;

  &lt;section class=&quot;section&quot; id=&quot;architecture&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;h2&gt;1. 先看进程边界&lt;/h2&gt;
      &lt;p&gt;在线 serving 中，API 前端与 EngineCore 默认分进程；EngineCore 持有调度器和 KV 的“账本”，GPU Worker 持有模型权重与真正的 KV tensors。单 GPU 的默认 &lt;code&gt;UniProcExecutor&lt;/code&gt; 会让 Worker 运行在 EngineCore 进程内；多卡 &lt;code&gt;mp&lt;/code&gt; 后端才通常为每个 GPU 启动独立 Worker 进程。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;architecture&quot; role=&quot;img&quot; aria-label=&quot;请求从 API Server 经 ZMQ 到 EngineCore，再由 Executor 调用 GPU Worker；单 GPU 时 Worker 与 Core 同进程，多 GPU 时通常为独立进程&quot;&gt;
      &lt;article class=&quot;arch-node api&quot;&gt;
        &lt;span class=&quot;viz-badge&quot;&gt;进程 A&lt;/span&gt;
        &lt;h3&gt;API Server / AsyncLLM&lt;/h3&gt;
        &lt;p&gt;FastAPI 路由、chat template、tokenize、SamplingParams、按请求维护输出队列与 detokenizer。&lt;/p&gt;
        &lt;code&gt;vllm/entrypoints/openai&lt;/code&gt;
      &lt;/article&gt;
      &lt;div class=&quot;arch-arrow&quot;&gt;&lt;strong&gt;ADD&lt;/strong&gt;&lt;span&gt;msgpack · ZMQ →&lt;/span&gt;&lt;/div&gt;
      &lt;article class=&quot;arch-node engine&quot;&gt;
        &lt;span class=&quot;viz-badge&quot;&gt;进程 B&lt;/span&gt;
        &lt;h3&gt;EngineCore&lt;/h3&gt;
        &lt;p&gt;Scheduler、Request 状态、KV BlockPool、prefix hash 索引；持续拼 continuous batch。&lt;/p&gt;
        &lt;code&gt;vllm/v1/engine/core.py&lt;/code&gt;
      &lt;/article&gt;
      &lt;div class=&quot;arch-arrow&quot;&gt;&lt;strong&gt;batch&lt;/strong&gt;&lt;span&gt;Executor →&lt;/span&gt;&lt;/div&gt;
      &lt;article class=&quot;arch-node worker&quot;&gt;
        &lt;span class=&quot;viz-badge&quot;&gt;单卡在进程 B 内 · 多卡通常每 GPU 一进程&lt;/span&gt;
        &lt;h3&gt;GPU Worker&lt;/h3&gt;
        &lt;p&gt;维护 persistent batch / block table，执行模型 forward、KV scatter write、attention 与 sampling。&lt;/p&gt;
        &lt;code&gt;vllm/v1/worker&lt;/code&gt;
      &lt;/article&gt;
    &lt;/div&gt;
    &lt;div class=&quot;return-line&quot; aria-label=&quot;输出反向返回&quot;&gt;
      &lt;div class=&quot;line&quot;&gt;&lt;/div&gt;&lt;span&gt;← SSE / JSON&lt;/span&gt;&lt;div class=&quot;line&quot;&gt;&lt;/div&gt;&lt;span&gt;← EngineCoreOutputs / ZMQ&lt;/span&gt;&lt;div class=&quot;line&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;scope-note&quot;&gt;边界说明：v0.25.0 对大多数受支持的非 MoE 生成模型会默认选择 Model Runner V2，并在配置兼容时默认启用异步调度。API → EngineCore → Scheduler 的主干不变，但 Worker 内部数据结构与 EngineCore 的批次推进方式会不同。本文固定 &lt;code&gt;VLLM_USE_V2_MODEL_RUNNER=0&lt;/code&gt; 与 &lt;code&gt;--no-async-scheduling&lt;/code&gt;，用 V1 GPUModelRunner 的同步路径讲清分页机制。&lt;/p&gt;
  &lt;/section&gt;

  &lt;section class=&quot;section&quot; id=&quot;request-flow&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;h2&gt;2. 一条 Chat 请求的源码调用链&lt;/h2&gt;
      &lt;p&gt;点击任一步，右侧会显示它拿到什么、做什么、交给谁，以及固定到 commit 的源码行。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;flow-layout&quot;&gt;
      &lt;div class=&quot;flow-list&quot; id=&quot;flow-list&quot; aria-label=&quot;请求处理步骤&quot;&gt;&lt;/div&gt;
      &lt;aside class=&quot;card flow-detail&quot; aria-live=&quot;polite&quot;&gt;
        &lt;span class=&quot;viz-badge&quot; id=&quot;flow-layer&quot;&gt;&lt;/span&gt;
        &lt;h3 id=&quot;flow-title&quot;&gt;&lt;/h3&gt;
        &lt;p id=&quot;flow-what&quot;&gt;&lt;/p&gt;
        &lt;div class=&quot;detail-meta&quot;&gt;
          &lt;div class=&quot;detail-row&quot;&gt;&lt;span&gt;入口&lt;/span&gt;&lt;code id=&quot;flow-symbol&quot;&gt;&lt;/code&gt;&lt;/div&gt;
          &lt;div class=&quot;detail-row&quot;&gt;&lt;span&gt;输入&lt;/span&gt;&lt;span id=&quot;flow-input&quot;&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;detail-row&quot;&gt;&lt;span&gt;输出&lt;/span&gt;&lt;span id=&quot;flow-output&quot;&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;detail-row&quot;&gt;&lt;span&gt;源码&lt;/span&gt;&lt;a id=&quot;flow-source&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;打开对应行&lt;/a&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/aside&gt;
    &lt;/div&gt;
    &lt;div class=&quot;loop&quot; role=&quot;img&quot; aria-label=&quot;EngineCore 每轮 schedule execute update output 的循环&quot;&gt;
      &lt;article class=&quot;loop-cell active&quot;&gt;&lt;span&gt;①&lt;/span&gt;&lt;h3&gt;Scheduler.schedule&lt;/h3&gt;&lt;p&gt;从 RUNNING 再到 WAITING；算 token budget、prefix hit、所需 Block IDs。&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;loop-cell&quot;&gt;&lt;span&gt;②&lt;/span&gt;&lt;h3&gt;execute_model&lt;/h3&gt;&lt;p&gt;Worker 更新 persistent batch 和 block table，准备 input_ids / positions / slot mapping。&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;loop-cell active&quot;&gt;&lt;span&gt;③&lt;/span&gt;&lt;h3&gt;Model + Attention&lt;/h3&gt;&lt;p&gt;逐层产生 Q/K/V；K/V scatter 到分页缓存；attention 通过 block table 读历史页。&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;loop-cell&quot;&gt;&lt;span&gt;④&lt;/span&gt;&lt;h3&gt;update_from_output&lt;/h3&gt;&lt;p&gt;接收 token，更新 num_computed_tokens / stop 状态；完成请求释放引用并产生输出。&lt;/p&gt;&lt;/article&gt;
    &lt;/div&gt;
    &lt;p class=&quot;loop-caption&quot;&gt;continuous batching 就发生在这个循环：每一轮都可把新请求的 prefill、旧请求的 decode、分块 prefill 拼进同一份 token budget；调度器源码明确说明它不把请求硬分成“prefill 队列”和“decode 队列”。&lt;/p&gt;
    &lt;p class=&quot;scope-note&quot;&gt;默认异步调度下，&lt;code&gt;EngineCore.step_with_batch_queue()&lt;/code&gt; 会先填充 batch queue，再按完成顺序取回结果并调用 &lt;code&gt;update_from_output()&lt;/code&gt;；上图表达的是单个批次的逻辑阶段，不表示默认路径必须在一次函数调用内串行完成。&lt;/p&gt;
  &lt;/section&gt;

  &lt;section class=&quot;section&quot; id=&quot;kv-basics&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;h2&gt;3. KV Cache 到底缓存了什么&lt;/h2&gt;
      &lt;p&gt;自回归注意力中，历史 token 的 K/V 会被以后所有 token 反复使用；历史 Q 只用于它自己当时那次查询，之后不再需要。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;viz-grid kv-why&quot;&gt;
      &lt;article class=&quot;card&quot;&gt;&lt;h3&gt;Q：当前问题&lt;/h3&gt;&lt;p&gt;每一步只需要当前待计算 token 的 Query 去“问”所有历史 K。历史 Q 不参与未来步骤，所以不缓存。&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;card&quot;&gt;&lt;h3&gt;K：可匹配的索引&lt;/h3&gt;&lt;p&gt;每个历史 token 的 Key 必须留下，未来 Query 要计算 &lt;code&gt;Q · Kᵀ&lt;/code&gt; 来得到注意力权重。&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;card&quot;&gt;&lt;h3&gt;V：可取回的内容&lt;/h3&gt;&lt;p&gt;权重得到后，要对历史 Value 做加权求和。K 与 V 因此按层、按 token 一起增长。&lt;/p&gt;&lt;/article&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mini-sequence&quot; role=&quot;img&quot; aria-label=&quot;prefill 生成首 token，下一轮 decode 才把该 token 写入 KV&quot;&gt;
      &lt;div class=&quot;phase&quot;&gt;&lt;strong&gt;Prefill&lt;/strong&gt;&lt;span&gt;计算 prompt 的全部 K/V，最后一个 prompt 位置的 logits 采样出 T₁。&lt;/span&gt;&lt;/div&gt;
      &lt;span&gt;→&lt;/span&gt;
      &lt;div class=&quot;phase&quot;&gt;&lt;strong&gt;Decode step 1&lt;/strong&gt;&lt;span&gt;把 T₁ 当输入，写入 K/V(T₁)，再从 logits 采样 T₂。&lt;/span&gt;&lt;/div&gt;
      &lt;span&gt;→&lt;/span&gt;
      &lt;div class=&quot;phase&quot;&gt;&lt;strong&gt;Decode step 2&lt;/strong&gt;&lt;span&gt;写入 K/V(T₂)，采样 T₃；如此循环。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;scope-note&quot;&gt;容易忽略：刚采样出的 token 还没有经过模型，因此它的 KV 要到下一轮才写入。Scheduler 用 &lt;code&gt;num_computed_tokens&lt;/code&gt; 追赶 &lt;code&gt;num_tokens_with_spec&lt;/code&gt;，正好统一了 prefill、decode、chunked prefill 和 speculative decode。&lt;/p&gt;
    &lt;div class=&quot;cache-layers&quot; role=&quot;img&quot; aria-label=&quot;KV 管理四层抽象&quot;&gt;
      &lt;article class=&quot;cache-layer&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;GPU bytes&lt;/span&gt;&lt;h3&gt;KV Tensor Pool&lt;/h3&gt;&lt;p&gt;启动时一次性按可用显存创建。每层都有按 page 排列的 K/V tensor view。&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;cache-layer&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;整数页号&lt;/span&gt;&lt;h3&gt;BlockPool&lt;/h3&gt;&lt;p&gt;管理 Block ID、ref_cnt、free queue、hash → block 映射；这里只是 CPU 侧账本。&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;cache-layer&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;读路径&lt;/span&gt;&lt;h3&gt;Block Table&lt;/h3&gt;&lt;p&gt;每个请求的逻辑块序号 → 物理 Block ID。历史 KV 可以离散分布。&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;cache-layer&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;写路径&lt;/span&gt;&lt;h3&gt;Slot Mapping&lt;/h3&gt;&lt;p&gt;&lt;code&gt;slot = physical_block_id × block_size + offset&lt;/code&gt;，本轮每个 token 一个槽位。&lt;/p&gt;&lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;section&quot; id=&quot;kv-simulator&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;h2&gt;4. Paged KV Cache 交互模拟&lt;/h2&gt;
      &lt;p&gt;调节 prompt 长度和 block size，再切换生命周期。示例物理页号故意是离散的，用来强调“连续 token 不要求连续显存”。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;viz-controls sim-controls&quot;&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;prompt-len&quot;&gt;Prompt tokens：&lt;output id=&quot;prompt-len-out&quot;&gt;35&lt;/output&gt;
        &lt;input class=&quot;form-range&quot; id=&quot;prompt-len&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;64&quot; value=&quot;35&quot;&gt;
      &lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;block-size&quot;&gt;Block size
        &lt;select class=&quot;form-select&quot; id=&quot;block-size&quot;&gt;
          &lt;option value=&quot;4&quot;&gt;4 tokens&lt;/option&gt;
          &lt;option value=&quot;8&quot;&gt;8 tokens&lt;/option&gt;
          &lt;option value=&quot;16&quot; selected&gt;16 tokens&lt;/option&gt;
        &lt;/select&gt;
      &lt;/label&gt;
      &lt;div class=&quot;stage-controls&quot; aria-label=&quot;生命周期阶段&quot;&gt;
        &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-stage=&quot;prefill&quot; aria-pressed=&quot;true&quot;&gt;首次 prefill&lt;/button&gt;
        &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-stage=&quot;decode&quot; aria-pressed=&quot;false&quot;&gt;decode 一步&lt;/button&gt;
        &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-stage=&quot;finish&quot; aria-pressed=&quot;false&quot;&gt;请求结束&lt;/button&gt;
        &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-stage=&quot;reuse&quot; aria-pressed=&quot;false&quot;&gt;同前缀新请求&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;viz-grid sim-summary&quot;&gt;
      &lt;article class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;本阶段已计算 KV&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot; id=&quot;computed-value&quot;&gt;35 tokens&lt;/span&gt;&lt;span class=&quot;text-muted&quot; id=&quot;computed-context&quot;&gt;&lt;/span&gt;&lt;/article&gt;
      &lt;article class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;Prefix cache 命中&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot; id=&quot;hit-value&quot;&gt;0 tokens&lt;/span&gt;&lt;span class=&quot;text-muted&quot; id=&quot;hit-context&quot;&gt;&lt;/span&gt;&lt;/article&gt;
      &lt;article class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;当前 Block Table&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot; id=&quot;table-value&quot;&gt;[7, 2, 11]&lt;/span&gt;&lt;span class=&quot;text-muted&quot;&gt;逻辑块 → 物理页&lt;/span&gt;&lt;/article&gt;
    &lt;/div&gt;
    &lt;div class=&quot;block-section&quot;&gt;
      &lt;h3&gt;请求视角：逻辑块&lt;/h3&gt;
      &lt;div class=&quot;logical-blocks&quot; id=&quot;logical-blocks&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;block-section&quot;&gt;
      &lt;h3&gt;GPU 池视角：物理页&lt;/h3&gt;
      &lt;div class=&quot;physical-pool&quot; id=&quot;physical-pool&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;legend&quot; aria-label=&quot;状态图例&quot;&gt;
        &lt;span&gt;&lt;i class=&quot;swatch active&quot;&gt;&lt;/i&gt;当前请求占用&lt;/span&gt;
        &lt;span&gt;&lt;i class=&quot;swatch cached&quot;&gt;&lt;/i&gt;ref=0 但可复用 / 可驱逐&lt;/span&gt;
        &lt;span&gt;&lt;i class=&quot;swatch shared&quot;&gt;&lt;/i&gt;prefix hit 后共享&lt;/span&gt;
        &lt;span&gt;&lt;i class=&quot;swatch&quot;&gt;&lt;/i&gt;空闲&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;block-section&quot;&gt;
      &lt;h3&gt;最后一个已计算 token 的地址换算&lt;/h3&gt;
      &lt;table class=&quot;mapping-table&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;position&lt;/th&gt;&lt;th&gt;logical block&lt;/th&gt;&lt;th&gt;physical block&lt;/th&gt;&lt;th&gt;offset&lt;/th&gt;&lt;th&gt;flat slot&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;&lt;tr&gt;&lt;td id=&quot;map-pos&quot;&gt;&lt;/td&gt;&lt;td id=&quot;map-logical&quot;&gt;&lt;/td&gt;&lt;td id=&quot;map-physical&quot;&gt;&lt;/td&gt;&lt;td id=&quot;map-offset&quot;&gt;&lt;/td&gt;&lt;td&gt;&lt;code id=&quot;map-slot&quot;&gt;&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;myths&quot;&gt;
      &lt;details open&gt;&lt;summary&gt;请求结束后，KV 是“释放”还是“缓存”？&lt;/summary&gt;&lt;p&gt;两者可以同时成立。&lt;code&gt;ref_cnt&lt;/code&gt; 降到 0 后，页回到 free queue；如果它有 full-block hash，内容仍可被 prefix cache 命中，同时它也是可驱逐候选。新分配拿到它时才删 hash、覆盖物理内容。&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;为什么只缓存 full block？&lt;/summary&gt;&lt;p&gt;完整块才有稳定的链式 hash 边界，也便于多请求共享同一页。partial block 仍可被当前请求继续写，但通常不进入可复用 hash 索引。&lt;/p&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;为什么 100% prompt 命中还要重算最后一个 token？&lt;/summary&gt;&lt;p&gt;KV 只能让 attention 跳过历史计算，却不能凭空提供“下一个 token”的 logits。v0.25.0 把最大命中长度限制为 &lt;code&gt;prompt_length - 1&lt;/code&gt;；受 block 对齐限制，可能重算最后一整块。&lt;/p&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;section&quot; id=&quot;memory&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;h2&gt;5. KV Cache 显存计算器&lt;/h2&gt;
      &lt;p&gt;输入“本 GPU 实际持有”的注意力层数与 KV heads，避免 TP / PP 的切分与复制规则干扰基本公式。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;viz-grid calc-grid&quot;&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;calc-layers&quot;&gt;本 GPU 注意力层数&lt;input class=&quot;form-control&quot; id=&quot;calc-layers&quot; type=&quot;number&quot; min=&quot;1&quot; value=&quot;32&quot;&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;calc-heads&quot;&gt;本 GPU KV heads&lt;input class=&quot;form-control&quot; id=&quot;calc-heads&quot; type=&quot;number&quot; min=&quot;1&quot; value=&quot;8&quot;&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;calc-dim&quot;&gt;Head dim&lt;input class=&quot;form-control&quot; id=&quot;calc-dim&quot; type=&quot;number&quot; min=&quot;1&quot; value=&quot;128&quot;&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;calc-bytes&quot;&gt;每元素 bytes&lt;select class=&quot;form-select&quot; id=&quot;calc-bytes&quot;&gt;&lt;option value=&quot;2&quot; selected&gt;2 · BF16/FP16&lt;/option&gt;&lt;option value=&quot;1&quot;&gt;1 · FP8/INT8（近似）&lt;/option&gt;&lt;option value=&quot;4&quot;&gt;4 · FP32&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;calc-block&quot;&gt;Block size&lt;input class=&quot;form-control&quot; id=&quot;calc-block&quot; type=&quot;number&quot; min=&quot;1&quot; value=&quot;16&quot;&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;calc-tokens&quot;&gt;序列 tokens&lt;input class=&quot;form-control&quot; id=&quot;calc-tokens&quot; type=&quot;number&quot; min=&quot;1&quot; value=&quot;4096&quot;&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;viz-grid calc-results&quot;&gt;
      &lt;article class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;每 token / 本 GPU&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot; id=&quot;per-token&quot;&gt;128 KiB&lt;/span&gt;&lt;span class=&quot;text-muted&quot;&gt;所有本地层的 K + V&lt;/span&gt;&lt;/article&gt;
      &lt;article class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;每 page / 本 GPU&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot; id=&quot;per-page&quot;&gt;2 MiB&lt;/span&gt;&lt;span class=&quot;text-muted&quot; id=&quot;page-context&quot;&gt;16 tokens&lt;/span&gt;&lt;/article&gt;
      &lt;article class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;分页容量 / 本 GPU&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot; id=&quot;sequence-size&quot;&gt;512 MiB&lt;/span&gt;&lt;span class=&quot;text-muted&quot; id=&quot;sequence-context&quot;&gt;有效数据 512 MiB · 256 pages · 尾页 0 空槽&lt;/span&gt;&lt;/article&gt;
    &lt;/div&gt;
    &lt;p class=&quot;formula&quot;&gt;&lt;code&gt;bytes_per_token = 2(K,V) × local_layers × local_kv_heads × head_dim × dtype_bytes&lt;/code&gt;&lt;/p&gt;
    &lt;p class=&quot;scope-note&quot;&gt;源码的单层 &lt;code&gt;AttentionSpec.real_page_size_bytes&lt;/code&gt; 正是 2 × block_size × num_kv_heads × head_size × dtype_size。这里的“分页容量”按完整 page 取整，是该序列关联的池容量，不代表请求到来时新增 malloc；GPU KV tensor pool 已在启动阶段预分配。量化 KV、MLA、滑窗、Mamba、混合层与 page padding 会改变真实值，计算器用于标准 full-attention 基线。&lt;/p&gt;
  &lt;/section&gt;

  &lt;section class=&quot;section&quot; id=&quot;sources&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;h2&gt;6. 源码索引：按阅读顺序&lt;/h2&gt;
      &lt;p&gt;链接固定到本次分析时 &lt;code&gt;releases/v0.25.0&lt;/code&gt; 的 commit &lt;code&gt;702f4814fe54fabff350d43cb753ae3e47c0c276&lt;/code&gt;。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;source-list&quot; id=&quot;source-list&quot;&gt;&lt;/div&gt;
    &lt;p class=&quot;footer-note&quot;&gt;建议阅读顺序：先看 &lt;code&gt;core.py:run_busy_loop&lt;/code&gt; 与同步基线的 &lt;code&gt;step&lt;/code&gt;，再对照默认异步路径的 &lt;code&gt;step_with_batch_queue&lt;/code&gt;；之后读 &lt;code&gt;scheduler.py:schedule&lt;/code&gt;，最后用 &lt;code&gt;block_table.py&lt;/code&gt; 和 attention backend 把 CPU 侧页号对应到 GPU 侧真实写入。&lt;/p&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;vllm-source-atlas&#x27;);
      const commit = &#x27;702f4814fe54fabff350d43cb753ae3e47c0c276&#x27;;
      const repo = `https://github.com/vllm-project/vllm/blob/${commit}/`;
      const src = (file, start, end) =&gt; `${repo}${file}#L${start}-L${end}`;

      root.querySelectorAll(&#x27;[data-scroll-target]&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const target = root.querySelector(`#${button.dataset.scrollTarget}`);
          target?.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;start&#x27; });
        });
      });

      const steps = [

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
